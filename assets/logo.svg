<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" opacity="0.1"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>

  <!-- M Letter -->
  <path d="M 120 320 L 120 180 L 180 260 L 240 180 L 240 320"
        fill="none"
        stroke="url(#grad1)"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- D Letter -->
  <path d="M 280 180 L 280 320 M 280 180 Q 380 180 380 250 Q 380 320 280 320"
        fill="none"
        stroke="url(#grad2)"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Accent Dots -->
  <circle cx="180" cy="140" r="8" fill="url(#grad1)" opacity="0.6"/>
  <circle cx="340" cy="140" r="8" fill="url(#grad2)" opacity="0.6"/>
  <circle cx="180" cy="360" r="8" fill="url(#grad1)" opacity="0.6"/>
  <circle cx="340" cy="360" r="8" fill="url(#grad2)" opacity="0.6"/>

  <!-- Markdown Symbol (# accent) -->
  <text x="420" y="140" font-family="monospace" font-size="48" font-weight="bold" fill="url(#grad2)" opacity="0.4">#</text>
</svg>