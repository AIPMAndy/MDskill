<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Theme Runtime Diagnostic</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      background: #252526;
      border-left: 3px solid #007acc;
    }
    .pass { color: #4ec9b0; }
    .fail { color: #f48771; }
    .warn { color: #dcdcaa; }
    h2 { color: #569cd6; margin-top: 0; }
    pre {
      background: #1e1e1e;
      padding: 10px;
      overflow-x: auto;
      border: 1px solid #3e3e42;
    }
    button {
      padding: 10px 20px;
      background: #007acc;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    button:hover {
      background: #005a9e;
    }
  </style>
</head>
<body>
  <h1>🔍 Theme Runtime Diagnostic</h1>

  <div class="section">
    <h2>Step 1: Global Objects Check</h2>
    <div id="global-check"></div>
  </div>

  <div class="section">
    <h2>Step 2: DOM Elements Check</h2>
    <div id="dom-check"></div>
  </div>

  <div class="section">
    <h2>Step 3: Manual Test</h2>
    <button onclick="testThemeButton()">Test Theme Button Click</button>
    <button onclick="testOpenPreview()">Manually Call openThemePreview()</button>
    <button onclick="checkModalState()">Check Modal State</button>
    <div id="manual-test" style="margin-top: 10px;"></div>
  </div>

  <div class="section">
    <h2>Step 4: Console Output</h2>
    <button onclick="dumpConsole()">Dump All Info to Console</button>
    <pre id="console-output">Click button above to see full diagnostic output in DevTools console (⌘ + Option + I)</pre>
  </div>

  <script>
    // Run checks on load
    window.addEventListener('DOMContentLoaded', () => {
      checkGlobals();
      checkDOM();
    });

    function log(elementId, message, type = 'info') {
      const el = document.getElementById(elementId);
      const className = type === 'pass' ? 'pass' : type === 'fail' ? 'fail' : type === 'warn' ? 'warn' : '';
      el.innerHTML += `<div class="${className}">${message}</div>`;
    }

    function checkGlobals() {
      const el = document.getElementById('global-check');
      el.innerHTML = '';

      // Check window.templates
      if (typeof window.templates !== 'undefined') {
        log('global-check', '✓ window.templates exists', 'pass');
        log('global-check', `  → Type: ${typeof window.templates}`, 'info');
        log('global-check', `  → Keys: ${Object.keys(window.templates).length}`, 'info');
      } else {
        log('global-check', '✗ window.templates NOT FOUND', 'fail');
      }

      // Check window.getAllTemplates
      if (typeof window.getAllTemplates === 'function') {
        log('global-check', '✓ window.getAllTemplates is a function', 'pass');
        try {
          const templates = window.getAllTemplates();
          log('global-check', `  → Returns ${templates.length} templates`, 'info');
        } catch (e) {
          log('global-check', `  → ERROR calling it: ${e.message}`, 'fail');
        }
      } else {
        log('global-check', '✗ window.getAllTemplates NOT FOUND', 'fail');
      }

      // Check window.getTemplateById
      if (typeof window.getTemplateById === 'function') {
        log('global-check', '✓ window.getTemplateById is a function', 'pass');
      } else {
        log('global-check', '✗ window.getTemplateById NOT FOUND', 'fail');
      }

      // Check window.themePreview
      if (typeof window.themePreview !== 'undefined') {
        log('global-check', '✓ window.themePreview exists', 'pass');
        log('global-check', `  → Type: ${typeof window.themePreview}`, 'info');
        if (window.themePreview) {
          const keys = Object.keys(window.themePreview);
          log('global-check', `  → Methods: ${keys.join(', ')}`, 'info');
        }
      } else {
        log('global-check', '✗ window.themePreview NOT FOUND', 'fail');
      }

      // Check window.themePreview.openThemePreview
      if (window.themePreview && typeof window.themePreview.openThemePreview === 'function') {
        log('global-check', '✓ window.themePreview.openThemePreview is a function', 'pass');
      } else {
        log('global-check', '✗ window.themePreview.openThemePreview NOT FOUND', 'fail');
      }
    }

    function checkDOM() {
      const el = document.getElementById('dom-check');
      el.innerHTML = '';

      // Check themeBtn
      const themeBtn = document.getElementById('themeBtn');
      if (themeBtn) {
        log('dom-check', '✓ #themeBtn element exists', 'pass');

        // Check if it has event listeners (we can't directly check, but we can see if it's connected)
        log('dom-check', `  → Tag: ${themeBtn.tagName}`, 'info');
        log('dom-check', `  → Visible: ${themeBtn.offsetParent !== null}`, 'info');
      } else {
        log('dom-check', '✗ #themeBtn element NOT FOUND', 'fail');
      }

      // Check modal
      const modal = document.getElementById('theme-preview-modal');
      if (modal) {
        log('dom-check', '✓ #theme-preview-modal element exists', 'pass');
        const computedStyle = window.getComputedStyle(modal);
        log('dom-check', `  → display: ${computedStyle.display}`, 'info');
        log('dom-check', `  → classList: ${modal.classList}`, 'info');
        log('dom-check', `  → z-index: ${computedStyle.zIndex}`, 'info');
      } else {
        log('dom-check', '✗ #theme-preview-modal element NOT FOUND', 'fail');
      }
    }

    function testThemeButton() {
      const output = document.getElementById('manual-test');
      output.innerHTML = '<div class="warn">Testing theme button click...</div>';

      const themeBtn = document.getElementById('themeBtn');
      if (!themeBtn) {
        output.innerHTML += '<div class="fail">✗ Cannot find themeBtn element</div>';
        return;
      }

      output.innerHTML += '<div class="pass">✓ Found themeBtn, simulating click...</div>';

      // Simulate click
      themeBtn.click();

      setTimeout(() => {
        const modal = document.getElementById('theme-preview-modal');
        if (modal && modal.classList.contains('active')) {
          output.innerHTML += '<div class="pass">✓ SUCCESS! Modal is now active</div>';
        } else {
          output.innerHTML += '<div class="fail">✗ FAILED! Modal did not become active</div>';
          output.innerHTML += '<div>Check console for errors</div>';
        }
      }, 100);
    }

    function testOpenPreview() {
      const output = document.getElementById('manual-test');
      output.innerHTML = '<div class="warn">Calling window.themePreview.openThemePreview()...</div>';

      if (!window.themePreview || !window.themePreview.openThemePreview) {
        output.innerHTML += '<div class="fail">✗ Function not available</div>';
        return;
      }

      try {
        window.themePreview.openThemePreview('github-dark');
        output.innerHTML += '<div class="pass">✓ Function called successfully</div>';

        setTimeout(() => {
          const modal = document.getElementById('theme-preview-modal');
          if (modal && modal.classList.contains('active')) {
            output.innerHTML += '<div class="pass">✓ Modal is visible!</div>';
          } else {
            output.innerHTML += '<div class="fail">✗ Modal is NOT visible</div>';
          }
        }, 100);
      } catch (e) {
        output.innerHTML += `<div class="fail">✗ ERROR: ${e.message}</div>`;
      }
    }

    function checkModalState() {
      const output = document.getElementById('manual-test');
      output.innerHTML = '';

      const modal = document.getElementById('theme-preview-modal');
      if (!modal) {
        output.innerHTML = '<div class="fail">✗ Modal element not found</div>';
        return;
      }

      const computedStyle = window.getComputedStyle(modal);
      output.innerHTML = `
        <div><strong>Modal State:</strong></div>
        <div>display: ${computedStyle.display}</div>
        <div>visibility: ${computedStyle.visibility}</div>
        <div>opacity: ${computedStyle.opacity}</div>
        <div>z-index: ${computedStyle.zIndex}</div>
        <div>classList: ${modal.classList}</div>
        <div>innerHTML length: ${modal.innerHTML.length} chars</div>
      `;
    }

    function dumpConsole() {
      console.log('=== FULL THEME DIAGNOSTIC ===');
      console.log('1. window.templates:', window.templates);
      console.log('2. window.getAllTemplates:', window.getAllTemplates);
      console.log('3. window.getTemplateById:', window.getTemplateById);
      console.log('4. window.themePreview:', window.themePreview);
      console.log('5. #themeBtn:', document.getElementById('themeBtn'));
      console.log('6. #theme-preview-modal:', document.getElementById('theme-preview-modal'));

      if (window.getAllTemplates) {
        console.log('7. All templates:', window.getAllTemplates());
      }

      const output = document.getElementById('console-output');
      output.textContent = 'Full diagnostic dumped to console! Open DevTools (⌘ + Option + I) to see details.';
    }
  </script>
</body>
</html>
