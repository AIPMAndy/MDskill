<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>激活专业版 - MDskill</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      text-align: center;
      margin-bottom: 30px;
    }

    .device-info {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .device-info label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .device-id {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 16px;
      color: #333;
      font-weight: 600;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .copy-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #5568d3;
    }

    .copy-btn:active {
      transform: scale(0.95);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Monaco', 'Menlo', monospace;
      resize: vertical;
      min-height: 100px;
      transition: border-color 0.2s;
    }

    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .contact-info {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      text-align: center;
      font-size: 13px;
      color: #666;
    }

    .contact-info strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔓 激活专业版</h1>
    <p class="subtitle">解锁所有主题和 PDF 导出功能</p>

    <div class="device-info">
      <label>您的设备指纹</label>
      <div class="device-id">
        <span id="deviceId">加载中...</span>
        <button class="copy-btn" id="copyBtn">复制</button>
      </div>
    </div>

    <div class="form-group">
      <label>授权码</label>
      <textarea
        id="licenseKey"
        placeholder="请输入从开发者处获取的授权码&#10;格式: MDSK-xxxxxxxx-xxxxxxxx"
      ></textarea>
    </div>

    <div class="button-group">
      <button class="btn btn-secondary" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="activateBtn">激活</button>
    </div>

    <div class="message" id="message"></div>

    <div class="contact-info">
      <p>还没有授权码？</p>
      <p><strong>微信: AIPMAndy</strong></p>
      <p>将设备指纹发送给开发者获取授权码</p>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const { clipboard } = require('electron');

    const deviceIdEl = document.getElementById('deviceId');
    const copyBtn = document.getElementById('copyBtn');
    const licenseKeyEl = document.getElementById('licenseKey');
    const activateBtn = document.getElementById('activateBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const messageEl = document.getElementById('message');

    // 加载设备指纹
    async function loadDeviceId() {
      const deviceId = await ipcRenderer.invoke('get-device-fingerprint');
      deviceIdEl.textContent = deviceId;
    }

    // 复制设备指纹
    copyBtn.addEventListener('click', () => {
      const deviceId = deviceIdEl.textContent;
      clipboard.writeText(deviceId);
      copyBtn.textContent = '已复制!';
      setTimeout(() => {
        copyBtn.textContent = '复制';
      }, 2000);
    });

    // 激活按钮
    activateBtn.addEventListener('click', async () => {
      const licenseKey = licenseKeyEl.value.trim();

      if (!licenseKey) {
        showMessage('请输入授权码', 'error');
        return;
      }

      activateBtn.disabled = true;
      activateBtn.textContent = '激活中...';

      try {
        const result = await ipcRenderer.invoke('activate-license', licenseKey);

        if (result.success) {
          showMessage('激活成功！专业版功能已解锁', 'success');
          setTimeout(() => {
            window.close();
          }, 1500);
        } else {
          showMessage(result.error || '激活失败', 'error');
          activateBtn.disabled = false;
          activateBtn.textContent = '激活';
        }
      } catch (error) {
        showMessage('激活出错: ' + error.message, 'error');
        activateBtn.disabled = false;
        activateBtn.textContent = '激活';
      }
    });

    // 取消按钮
    cancelBtn.addEventListener('click', () => {
      window.close();
    });

    // 显示消息
    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'block';
    }

    // 初始化
    loadDeviceId();
  </script>
</body>
</html>
