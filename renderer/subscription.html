<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订阅管理 - MDSKILL</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      color: #1d1d1f;
    }

    body.i18n-loading {
      visibility: hidden;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }

    /* 头部 */
    .header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid #e5e5e7;
    }

    .header-title {
      font-size: 24px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 14px;
      color: #86868b;
    }

    /* 状态卡片 */
    .status-section {
      padding: 20px 24px;
      border-bottom: 1px solid #e5e5e7;
    }

    .status-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
    }

    .status-icon {
      font-size: 24px;
      margin-right: 12px;
      width: 32px;
      text-align: center;
    }

    .status-content {
      flex: 1;
    }

    .status-label {
      font-size: 13px;
      color: #86868b;
      margin-bottom: 2px;
    }

    .status-value {
      font-size: 15px;
      font-weight: 500;
      color: #1d1d1f;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-trial {
      background: #fff3cd;
      color: #856404;
    }

    .badge-active {
      background: #d1ecf1;
      color: #0c5460;
    }

    .badge-expired {
      background: #f8d7da;
      color: #721c24;
    }

    .days-highlight {
      font-size: 28px;
      font-weight: 700;
      color: #0078D2;
    }

    /* 功能列表 */
    .features-section {
      padding: 20px 24px;
      border-bottom: 1px solid #e5e5e7;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .feature-list {
      list-style: none;
    }

    .feature-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f5f5f7;
    }

    .feature-item:last-child {
      border-bottom: none;
    }

    .feature-icon {
      font-size: 18px;
      margin-right: 12px;
      width: 24px;
      text-align: center;
    }

    .feature-text {
      flex: 1;
      font-size: 15px;
      color: #1d1d1f;
    }

    /* 价格区域 */
    .pricing-section {
      padding: 20px 24px;
      border-bottom: 1px solid #e5e5e7;
      background: #fafafa;
    }

    .pricing-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      margin-bottom: 8px;
    }

    .price-amount {
      font-size: 36px;
      font-weight: 700;
      color: #0078D2;
    }

    .price-period {
      font-size: 16px;
      color: #86868b;
      margin-left: 4px;
    }

    .pricing-note {
      text-align: center;
      font-size: 13px;
      color: #86868b;
      margin-bottom: 4px;
    }

    .pricing-highlight {
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #0078D2;
    }

    /* 按钮区域 */
    .actions-section {
      padding: 20px 24px;
    }

    .btn {
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .btn:last-child {
      margin-bottom: 0;
    }

    .btn-primary {
      background: #0078D2;
      color: white;
    }

    .btn-primary:hover {
      background: #006bb3;
    }

    .btn-primary:active {
      background: #005a94;
    }

    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .btn-secondary:hover {
      background: #e5e5e7;
    }

    .btn-secondary:active {
      background: #d1d1d6;
    }

    .btn-text {
      background: transparent;
      color: #0078D2;
      padding: 8px 20px;
    }

    .btn-text:hover {
      background: #f5f5f7;
    }

    /* 用户信息 */
    .user-info-section {
      padding: 16px 24px;
      background: #fafafa;
      border-top: 1px solid #e5e5e7;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
    }

    .info-label {
      color: #86868b;
    }

    .info-value {
      color: #1d1d1f;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
    }

    /* 弹窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 16px;
    }

    .modal-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'SF Mono', Monaco, monospace;
      margin-bottom: 16px;
    }

    .modal-input:focus {
      outline: none;
      border-color: #0078D2;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .modal-buttons .btn {
      margin-bottom: 0;
    }

    /* 支付说明 */
    .payment-info {
      padding: 16px 24px;
      background: #f5f5f7;
      border-top: 1px solid #e5e5e7;
      text-align: center;
    }

    .payment-tabs {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .payment-tab {
      padding: 8px 16px;
      border-radius: 8px;
      background: white;
      border: 1px solid #e5e5e7;
      cursor: pointer;
      transition: all 0.2s;
    }

    .payment-tab:hover {
      border-color: #0078D2;
    }

    .payment-tab.active {
      background: #0078D2;
      color: white;
      border-color: #0078D2;
    }

    .qr-placeholder {
      width: 200px;
      height: 200px;
      margin: 0 auto 12px;
      background: white;
      border: 1px solid #e5e5e7;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #86868b;
      font-size: 14px;
    }

    .payment-note {
      font-size: 13px;
      color: #86868b;
    }
  </style>
</head>
<body class="i18n-loading">
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <div class="header-title">订阅管理</div>
      <div class="header-subtitle">MDSKILL 专业版</div>
    </div>

    <!-- 状态区域 -->
    <div class="status-section">
      <div class="status-row">
        <div class="status-icon">👤</div>
        <div class="status-content">
          <div class="status-label">用户ID</div>
          <div class="status-value" id="userId">加载中...</div>
        </div>
      </div>

      <div class="status-row">
        <div class="status-icon">⭐</div>
        <div class="status-content">
          <div class="status-label">订阅状态</div>
          <div class="status-value">
            <span class="status-badge badge-trial" id="statusBadge">试用期</span>
          </div>
        </div>
      </div>

      <div class="status-row">
        <div class="status-icon">📅</div>
        <div class="status-content">
          <div class="status-label">剩余时间</div>
          <div class="status-value">
            <span class="days-highlight" id="daysLeft">7</span> <span id="daysUnit">天</span>
          </div>
        </div>
      </div>

      <div class="status-row">
        <div class="status-icon">🗓️</div>
        <div class="status-content">
          <div class="status-label">到期日期</div>
          <div class="status-value" id="expiryDate">2026-06-07</div>
        </div>
      </div>
    </div>

    <!-- 专业功能 -->
    <div class="features-section">
      <div class="section-title">专业功能</div>
      <ul class="feature-list">
        <li class="feature-item">
          <span class="feature-icon">📱</span>
          <span class="feature-text">复制到微信公众号</span>
        </li>
        <li class="feature-item">
          <span class="feature-icon">📝</span>
          <span class="feature-text">复制到博客平台</span>
        </li>
        <li class="feature-item">
          <span class="feature-icon">💻</span>
          <span class="feature-text">复制HTML源码</span>
        </li>
        <li class="feature-item">
          <span class="feature-icon">📄</span>
          <span class="feature-text">导出PDF</span>
        </li>
        <li class="feature-item">
          <span class="feature-icon">🎨</span>
          <span class="feature-text">13种精美主题</span>
        </li>
      </ul>
    </div>

    <!-- 价格区域 -->
    <div class="pricing-section">
      <div class="pricing-row">
        <span class="price-amount">¥19</span>
        <span class="price-period">/月起</span>
      </div>
      <div class="pricing-note">月付 ¥19 | 年付 ¥99</div>
      <div class="pricing-highlight">年付节省 ¥129（推荐）</div>
    </div>

    <!-- 购买说明 -->
    <div class="payment-info" style="display: block;">
      <div class="payment-note" style="margin-bottom: 12px;">如需购买激活码，请通过以下方式联系：</div>
      <div style="text-align: center; margin-bottom: 8px;">
        <strong style="color: #1d1d1f;">微信：</strong>
        <span style="color: #0078D2; font-weight: 500;">AIPMAndy</span>
      </div>
      <div style="text-align: center;">
        <strong style="color: #1d1d1f;">邮箱：</strong>
        <span style="color: #0078D2; font-weight: 500;">supera6@qq.com</span>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions-section">
      <button class="btn btn-secondary" id="activateCodeBtn">🔑 我有激活码</button>
      <button class="btn btn-text" id="laterBtn">稍后</button>
    </div>

    <!-- 用户信息 -->
    <div class="user-info-section">
      <div class="info-row">
        <span class="info-label">设备ID</span>
        <span class="info-value" id="deviceId">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">最后验证</span>
        <span class="info-value" id="lastVerified">-</span>
      </div>
    </div>

    <!-- 测试按钮 -->
    <div style="padding: 16px 24px; text-align: center; border-top: 1px solid #e5e5e7;">
      <button class="btn btn-text" id="resetBtn" style="font-size: 12px; color: #86868b;">
        🔧 重置订阅（测试用）
      </button>
    </div>
  </div>

  <!-- 激活码弹窗 -->
  <div id="activationModal" class="modal">
    <div class="modal-content">
      <div class="modal-title">输入激活码</div>
      <input
        type="text"
        class="modal-input"
        id="activationCodeInput"
        placeholder="eyJ1-c2Vy-SWQi-...|df52-b5e6-..."
      />
      <div class="modal-buttons">
        <button class="btn btn-secondary" id="cancelBtn">取消</button>
        <button class="btn btn-primary" id="confirmActivateBtn">激活</button>
      </div>
    </div>
  </div>

  <script src="i18n-helpers.js"></script>
  <script>
    const i18n = () => window.i18nHelpers;
    const tr = (key, params = {}) => i18n() ? i18n().t(key, params) : key;
    const getCurrentLocale = () => {
      const lang = i18n() ? i18n().getCurrentLanguage() : 'en';
      return lang === 'zh' ? 'zh-CN' : 'en-US';
    };

    const subscriptionText = {
      enterCode: () => window.subscriptionAlerts ? window.subscriptionAlerts.enterCode() : tr('subscriptionPage.alertEnterCode'),
      activateSuccess: (months, date) => window.subscriptionAlerts ? window.subscriptionAlerts.activateSuccess(months, date) : tr('subscriptionPage.alertActivateSuccess', { months, date }),
      activateFailed: (error) => window.subscriptionAlerts ? window.subscriptionAlerts.activateFailed(error) : tr('subscriptionPage.alertActivateFailed', { error }),
      confirmReset: () => window.subscriptionAlerts ? window.subscriptionAlerts.confirmReset() : tr('subscriptionPage.confirmReset'),
      resetSuccess: () => window.subscriptionAlerts ? window.subscriptionAlerts.resetSuccess() : tr('subscriptionPage.alertResetSuccess'),
      resetFailed: (error) => window.subscriptionAlerts ? window.subscriptionAlerts.resetFailed(error) : tr('subscriptionPage.alertResetFailed', { error }),
      statusTrial: () => window.subscriptionAlerts ? window.subscriptionAlerts.statusTrial() : tr('subscriptionPage.statusTrial'),
      statusActive: () => window.subscriptionAlerts ? window.subscriptionAlerts.statusActive() : tr('subscriptionPage.statusActive'),
      statusExpired: () => window.subscriptionAlerts ? window.subscriptionAlerts.statusExpired() : tr('subscriptionPage.statusExpired'),
      unknownError: () => window.subscriptionAlerts ? window.subscriptionAlerts.unknownError() : tr('subscriptionPage.unknownError'),
      ipcUnavailableRequire: () => window.subscriptionAlerts ? window.subscriptionAlerts.ipcUnavailableRequire() : tr('subscriptionPage.ipcUnavailableRequire'),
      ipcUnavailableUndefined: () => window.subscriptionAlerts ? window.subscriptionAlerts.ipcUnavailableUndefined() : tr('subscriptionPage.ipcUnavailableUndefined')
    };

    // IPC 通信
    let ipcRenderer;
    try {
      ipcRenderer = require('electron').ipcRenderer;
    } catch (error) {
      console.error('Failed to load ipcRenderer via require:', error);
      // 备用方案：使用 window.electron（如果有 preload 脚本）
      if (window.electron && window.electron.ipcRenderer) {
        ipcRenderer = window.electron.ipcRenderer;
      } else {
        alert(subscriptionText.ipcUnavailableRequire());
        throw new Error('IPC communication unavailable');
      }
    }

    if (!ipcRenderer) {
      alert(subscriptionText.ipcUnavailableUndefined());
      throw new Error('ipcRenderer is undefined');
    }

    // 加载订阅信息
    async function loadSubscriptionInfo() {
      try {
        const result = await ipcRenderer.invoke('get-subscription-info');
        const info = result.data;

        // 更新用户ID
        document.getElementById('userId').textContent = info.userId || '-';
        document.getElementById('deviceId').textContent = info.deviceId || '-';

        // 更新状态
        const statusBadge = document.getElementById('statusBadge');
        if (info.status === 'trial') {
          statusBadge.textContent = subscriptionText.statusTrial();
          statusBadge.className = 'status-badge badge-trial';
        } else if (info.status === 'active') {
          statusBadge.textContent = subscriptionText.statusActive();
          statusBadge.className = 'status-badge badge-active';
        } else if (info.status === 'expired') {
          statusBadge.textContent = subscriptionText.statusExpired();
          statusBadge.className = 'status-badge badge-expired';
        }

        // 更新剩余天数
        document.getElementById('daysLeft').textContent = info.daysLeft || 0;

        // 更新到期日期
        if (info.expiryDate) {
          const date = new Date(info.expiryDate);
          document.getElementById('expiryDate').textContent = date.toLocaleDateString(getCurrentLocale());
        }

        // 更新最后验证时间
        if (info.lastVerified) {
          const date = new Date(info.lastVerified);
          document.getElementById('lastVerified').textContent = date.toLocaleString(getCurrentLocale());
        }
      } catch (error) {
        console.error('加载订阅信息失败:', error);
      }
    }

    // 显示激活码弹窗
    document.getElementById('activateCodeBtn').addEventListener('click', () => {
      document.getElementById('activationModal').classList.add('show');
    });

    // 取消激活
    document.getElementById('cancelBtn').addEventListener('click', () => {
      document.getElementById('activationModal').classList.remove('show');
    });

    // 确认激活
    document.getElementById('confirmActivateBtn').addEventListener('click', async () => {
      const code = document.getElementById('activationCodeInput').value.trim();

      if (!code) {
        alert(subscriptionText.enterCode());
        return;
      }

      try {
        const result = await ipcRenderer.invoke('activate-with-code', code);

        if (result.success && result.data) {
          const expiryDate = new Date(result.data.expiryDate).toLocaleDateString(getCurrentLocale());
          alert(subscriptionText.activateSuccess(result.data.months, expiryDate));
          document.getElementById('activationModal').classList.remove('show');
          document.getElementById('activationCodeInput').value = '';
          loadSubscriptionInfo();
        } else {
          alert(subscriptionText.activateFailed(result.error || result.message || subscriptionText.unknownError()));
        }
      } catch (error) {
        alert(subscriptionText.activateFailed(error.message));
      }
    });

    // 稍后按钮
    document.getElementById('laterBtn').addEventListener('click', () => {
      window.close();
    });

    // 重置订阅（测试用）
    document.getElementById('resetBtn').addEventListener('click', async () => {
      if (!confirm(subscriptionText.confirmReset())) {
        return;
      }

      try {
        await ipcRenderer.invoke('reset-subscription');
        alert(subscriptionText.resetSuccess());
        loadSubscriptionInfo();
      } catch (error) {
        alert(subscriptionText.resetFailed(error.message));
      }
    });

    window.loadSubscriptionInfo = loadSubscriptionInfo;

    // 页面加载时加载订阅信息
    loadSubscriptionInfo();
  </script>
  <script src="subscription-i18n.js"></script>
</body>
</html>
