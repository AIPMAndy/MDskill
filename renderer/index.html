    <!-- 主内容区域 -->
    <div class="main-content" style="display: flex; flex: 1; overflow: hidden;">
      <!-- 主编辑区域 -->
      <div class="editor-container" style="display: flex; flex: 1; overflow: hidden; position: relative;">
        <div class="editor-pane" id="editorPane" style="width: 50%; min-width: 200px; overflow: auto; padding: 20px; background: #1e1e1e; border-right: 1px solid #3e3e42;">
          <textarea id="editor" placeholder="" style="width: 100%; height: 100%; background: transparent; border: none; outline: none; resize: none; font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace; font-size: 14px; line-height: 1.6; color: #d4d4d4; caret-color: #d4d4d4;"></textarea>
        </div>
        <div class="editor-resize-handle" id="editorResizeHandle"></div>
        <div class="preview-pane" id="previewPane" style="flex: 1; overflow: auto; padding: 20px; background: #252526;">
          <div class="markdown-body" id="preview"></div>
        </div>

        <!-- AI 格式化进度提示 -->
        <div id="aiProgressOverlay" class="ai-progress-overlay" style="display: none;">
          <div class="ai-progress-content">
            <div class="ai-progress-spinner"></div>
            <div class="ai-progress-text" id="aiProgressText">Andy is converting this to Markdown...</div>
            <button class="ai-progress-cancel" id="aiCancelBtn">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <span id="wordCount" class="status-item">0 words, 0 chars</span>
      <span id="currentTheme" class="status-item">GitHub Dark</span>
      <span id="fontSize" class="status-item">16px</span>
      <span id="autoSave" class="status-item">Not saved</span>
    </div>
  </div>

  <!-- 动态样式注入 -->
  <style id="dynamicStyles"></style>

  <!-- 主题预览模态框 -->
  <div id="theme-preview-modal" class="theme-modal">
    <div class="theme-modal-overlay"></div>
    <div class="theme-modal-content">
      <div class="theme-modal-header">
        <h2 id="themeModalTitle">选择主题</h2>
        <button id="closeThemePreview" class="theme-close-btn">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
            <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
          </svg>
        </button>
      </div>
      <div class="theme-modal-body">
        <div class="theme-categories" id="categoryTabs">
          <!-- 分类标签将由 JavaScript 动态生成 -->
        </div>
        <div class="theme-grid" id="themeGrid">
          <!-- 主题卡片将由 JavaScript 动态生成 -->
        </div>
      </div>
    </div>
  </div>

  <style>
    /* 主题预览模态框样式 */
    .theme-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .theme-modal.active {
      display: flex;
    }

    .theme-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    .theme-modal-content {
      position: relative;
      background: #1e1e1e;
      border-radius: 12px;
      width: 90%;
      max-width: 1200px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: modalSlideIn 0.3s ease-out;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .theme-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid #333;
    }

    .theme-modal-header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .theme-close-btn {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .theme-close-btn:hover {
      background: #333;
      color: #fff;
    }

    .theme-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .theme-categories {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .category-tab {
      padding: 8px 16px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 20px;
      color: #999;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-tab:hover {
      background: #333;
      color: #fff;
      border-color: #444;
    }

    .category-tab.active {
      background: #667eea;
      color: #fff;
      border-color: #667eea;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .theme-card {
      background: #2a2a2a;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .theme-card:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.2);
    }

    .theme-card.selected {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
    }

    .theme-card.pro-locked {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .theme-card.pro-locked:hover {
      transform: none;
      border-color: #333;
    }

    .pro-lock-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: #fbbf24;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 16px;
      z-index: 10;
    }

    .theme-preview {
      height: 180px;
      padding: 16px;
      overflow: hidden;
      font-size: 12px;
      line-height: 1.5;
    }

    .theme-preview h1 {
      font-size: 16px;
      margin: 0 0 8px 0;
    }

    .theme-preview h2 {
      font-size: 14px;
      margin: 8px 0 6px 0;
    }

    .theme-preview p {
      font-size: 12px;
      margin: 6px 0;
    }

    .theme-preview code {
      font-size: 11px;
      padding: 2px 4px;
    }

    .theme-preview blockquote {
      font-size: 11px;
      margin: 8px 0;
      padding: 6px 10px;
    }

    .theme-info {
      padding: 12px 16px;
      background: #1e1e1e;
      border-top: 1px solid #333;
    }

    .theme-name {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .theme-icon {
      font-size: 18px;
    }

    .theme-name-text {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      flex: 1;
    }

    .pro-badge {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      color: #000;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .theme-description {
      font-size: 13px;
      color: #999;
      margin: 0;
      line-height: 1.4;
    }

    /* 滚动条样式 */
    .theme-modal-body::-webkit-scrollbar {
      width: 8px;
    }

    .theme-modal-body::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    .theme-modal-body::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    .theme-modal-body::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
